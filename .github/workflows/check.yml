# Shows whether the alert helper is running and what it sees. Run it from the Actions tab.
name: Check helper

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Helper status
        run: |
          H=https://travel-geek.sakthiramkumar12.workers.dev
          curl -sS -m 30 "$H/"; echo
          curl -sS -m 30 "$H/api/state" -o state.json
          python3 - <<'PY'
          import json, time
          d = json.load(open("state.json"))
          now = int(time.time())
          print("last run report:", d.get("report"))
          print("source:", d.get("source"), "| last run", now - d.get("tickAt", 0), "s ago | prices", now - d.get("pricesAt", 0), "s ago")
          print("countries seen (seconds ago):", {k: (now - v if v else None) for k, v in d.get("updates", {}).items()})
          items = d.get("items", [])
          print("items:", len(items), "| with restock history:", sum(1 for i in items if (i.get("pred") or {}).get("n")))
          for i in sorted(items, key=lambda i: -((i.get("sell") or 0) - i.get("cost", 0)))[:15]:
              print(f'{i["key"]:9} {i["name"][:22]:22} qty {i["qty"]:>6} cost {i["cost"]:>9} sell {i.get("sell", 0):>9} {i.get("type", "")} ({i.get("speed")}) pred {i.get("pred")}')
          PY
      - name: Full state (for replaying the planner)
        run: |
          curl -sS -m 30 "https://travel-geek.sakthiramkumar12.workers.dev/api/state" | python3 -c "import json,sys; d=json.load(sys.stdin); print('STATE-JSON', json.dumps({'now': d.get('tickAt'), 'items': d.get('items', [])}, separators=(',', ':')))"
      - name: How many bazaars sell each travel item
        run: |
          curl -sS -m 30 https://weav3r.dev/api/marketplace -o w3b.json
          python3 - <<'PY'
          import json
          d = json.load(open("w3b.json"))["items"]
          names = ["Xanax", "Jaguar Plushie", "Camel Plushie", "Panda Plushie", "Ceibo Flower", "Tribulus Omanense", "Raw Ivory", "Ambergris Lump", "Natural Pearls", "Pangolin Scales", "Patagonian Fossil", "Hydrochloric Acid", "Neumune Tablet", "Smoke Grenade", "Large Suitcase", "Combat Pants", "Dual 92G Berettas", "Cherry Blossom", "Edelweiss", "Chamois Plushie"]
          for i in d:
              if i.get("item_name") in names:
                  print(f'{i["item_name"]:22} bazaars {i.get("total_bazaars")}  mv {i.get("market_price")}')
          vals = sorted(i.get("total_bazaars") or 0 for i in d)
          print("all items: median bazaars", vals[len(vals)//2], "| 75th", vals[len(vals)*3//4], "| 90th", vals[len(vals)*9//10])
          PY
